# Next.js 14 auf Netlify — ohne Plugin schlägt der Build bzw. das Routing oft fehl.
# https://docs.netlify.com/integrations/frameworks/next-js/overview/

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[context.staging.environment]
  NEXT_PUBLIC_SITE_URL = "https://staging--baerenwald.netlify.app"
  NEXT_PUBLIC_WEBSEITE_URL = "https://staging--baerenwald.netlify.app"
  FRONTEND_URL = "https://staging--baerenwald.netlify.app"
  CRM_PUBLIC_URL = "https://staging--baerenwald-backend.netlify.app"
  NEXT_PUBLIC_APP_URL = "https://staging--baerenwald-backend.netlify.app"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Puppeteer / @sparticuz/chromium für Angebot-PDF beim Mail-Versand
# Cron: eine Scheduled Function netlify/functions/cron-dispatcher.mjs (0,30 * * * * UTC)
# Env >4KB: docs/NETLIFY-DEPLOY.md (Scopes in Netlify UI)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = [
    "node_modules/@sparticuz/chromium/bin/**",
    "node_modules/@sparticuz/chromium/build/**",
    "scripts/ki-analyse/**",
  ]
