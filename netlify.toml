# Next.js 14 auf Netlify — ohne Plugin schlägt der Build bzw. das Routing oft fehl.
# https://docs.netlify.com/integrations/frameworks/next-js/overview/

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Puppeteer / @sparticuz/chromium für Angebot-PDF beim Mail-Versand
[functions]
  included_files = [
    "node_modules/@sparticuz/chromium/bin/**",
    "node_modules/@sparticuz/chromium/build/**",
    "scripts/ki-analyse/**",
  ]

# Hinweis: Netlify kennt KEIN [[scheduled]] in netlify.toml (das war Vercel-Syntax
# und verursachte "Error loading the config file").
# Cron-Jobs für die Next.js-API-Routen bitte extern auslösen (z. B. GitHub Action
# oder cron-job.org) mit Bearer CRON_SECRET auf die /api/cron/*-Endpunkte, oder
# als native Netlify Scheduled Functions in netlify/functions/ mit
# `export const config = { schedule: "..." }`.
